# Breast Cancer Prediction - Configuration
project:
  name: "breast-cancer-hackathon"
  random_state: 42

paths:
  data_raw: "data/breast_cancer_prediction.csv"
  data_cleaned: "data/breast_cancer_cleaned.csv"
  model_dir: "models/"
  output_dir: "outputs/"
  plot_dir: "outputs/plots/"
  metrics_dir: "outputs/metrics/"

features:
  drop:
    - "Patient_ID"
    - "Biopsy_Result"
    - "Cancer_Stage"

  target: "Cancer"

  categorical:
    binary:
      - "Gender"
      - "Family_History"
      - "Smoking"
      - "Alcohol_Consumption"
      - "Hormone_Therapy"
      - "Menopause_Status"
      - "Genetic_Mutation"
      - "Lymph_Node_Involvement"
      - "Diabetes"
    ordinal:
      Physical_Activity: ["Low", "Moderate", "High"]
      Mammogram_Result: ["Normal", "Suspicious", "Abnormal"]
    onehot:
      - "Breastfeeding_History"

  numerical:
    - "Age"
    - "BMI"
    - "Tumor_Size_cm"
    - "Blood_Pressure"
    - "Cholesterol"
    - "Exercise_Days_Per_Week"
    - "Annual_Income_USD"

preprocessing:
  # Two classes of transform, separated by whether they learn anything from data.
  #
  # DETERMINISTIC (applied before the split -- safe, because the rule is fixed in
  # advance and identical for every row, so no test information can flow into it):
  #   constant categorical fills, fixed clinical bounds, fixed encoding maps.
  #
  # LEARNED (fitted inside the training folds only -- these are dataset statistics
  # and would leak if computed over rows that later land in validation or test):
  #   median imputation, StandardScaler mean/std.
  imputation:
    # Constant fills -- deterministic, applied pre-split.
    Alcohol_Consumption: "No"
    Physical_Activity: "Moderate"
    Hormone_Therapy: "No"
    # Median fills -- learned, fitted per training fold.
    BMI: "median"
    Tumor_Size_cm: "median"

  outlier_capping:
    # Fixed physiological bounds, not percentiles of this dataset.
    BMI: [15.0, 50.0]

  scaling: "StandardScaler"   # continuous columns only; discrete levels left intact

model:
  # Three-way split: 20% test, then 20% of the remaining 80% as validation.
  # Effective proportions of the full dataset: 64% train / 16% val / 20% test.
  test_size: 0.2
  val_size: 0.2
  stratify: true

  resampling:
    # SMOTENC, not SMOTE: the matrix is mixed-type, and plain SMOTE would
    # interpolate categorical columns into impossible fractional states.
    method: "SMOTENC"
    k_neighbors: 5
    # Applied inside the CV pipeline so held-out folds are never resampled.
    inside_cv_pipeline: true

  # Imbalance strategies are compared as alternatives, never stacked.
  imbalance_experiments:
    - name: "class_weight"   # cost-sensitive only, no resampling
      class_weight: "balanced"
      use_smotenc: false
    - name: "smotenc"        # resampling only, no extra weighting
      class_weight: null
      use_smotenc: true

  cv:
    folds: 5
    # Hyperparameters are tuned on a threshold-free metric. Optimising recall
    # directly would reward predicting "malignant" for every patient.
    scoring: "average_precision"

  hyperparameters:
    random_forest:
      n_estimators: [100, 200]
      max_depth: [5, 10, 15]
      min_samples_split: [2, 5]

    xgboost:
      max_depth: [3, 5, 7]
      learning_rate: [0.01, 0.1]
      n_estimators: [100, 200]

evaluation:
  primary_metric: "recall"  # For class 1 (Malignant)
  target_recall: 0.90
  target_f1: 0.85
  target_roc_auc: 0.90

  # Decision threshold is chosen on the VALIDATION set, then locked before the
  # test set is touched. It is persisted into models/encoders.pkl so that
  # evaluation and the Streamlit app both read the same value instead of
  # defaulting to 0.50 independently.
  threshold_selection:
    candidates: [0.50, 0.45, 0.40, 0.35, 0.30]
    selected_on: "validation"
    min_precision: 0.70
    rule: "highest recall among candidates with precision >= min_precision; ties broken on F1"
